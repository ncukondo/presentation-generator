# ============================================================================
# slides.yaml — スライドの内容・ナレーション原稿の一元管理ファイル（データ駆動モード）
#
# 各スライドは `layout` で描画方法を宣言し、`visual` にレイアウト別パラメータを持つ。
# 汎用レンダラ (lib/render.ts) が `layout` を見て描画する。スライドの追加・編集・
# 並べ替え・複製は、このファイルの編集だけで完結する（pages/*.ts は廃止）。
#
# 構造:
#   - id:        スライドの一意識別子（重複不可。表示順は配列の並び順）
#   - layout:    レンダラ名（title / agenda / bullets / section / number-cards /
#                evidence / steps / step-detail / figure / split / chart / table /
#                big-stat / risks / checklist / statement / closing / references）
#                ※ 旧 grid は number-cards に統合（subtitle + cites を吸収）
#   - title:     スライドタイトル（多くの layout で共通）
#   - narration: TTS・動画で読み上げる原稿（省略可。指定時は PowerPoint ノートにも入る）
#   - notes:     PowerPoint ノート専用メモ（省略可。TTS では読み上げない。ナレーション不要の
#                デッキで登壇メモを書く用途。ノート欄に入るのは notes ?? narration）
#   - visual:    layout 別のデータ（subtitle, cards, items, steps 等）
#
# layout ごとの visual スキーマは docs/layouts.md を参照。
#
# ナレーション修正例:
#   yq '(.slides[] | select(.id == "background")).narration = "新しいナレーション"' -i slides.yaml
# ============================================================================

# ============================================================================
# theme — カラーパレット・フォントの選択（内容に合った配色を準備するブロック）
#   解決の優先順: preset → primary(シード自動生成) → デフォルト(slate) → 個別上書き
#   詳細は docs/theme.md / lib/themes.ts を参照。
# ----------------------------------------------------------------------------
theme:
  preset: slate           # プリセット名: slate(学術既定) / blue / warm / forest
  # --- 個別上書き（任意・任意の Palette キーを hex で）---
  # primary: "1E88E5"
  # accent:  "FF9800"
  # --- シードから自動生成する場合（preset 行を消し primary を起点に）---
  # primary: "6A1B9A"     # この1色から pastel / step / accent を導出
  # --- フォント上書き（任意）---
  # fonts: { jp: Meiryo, en: Arial }

slides:
  # --------------------------------------------------------------------------
  # タイトルスライド
  # layout: title / visual: { subtitle, presenter }
  # --------------------------------------------------------------------------
  - id: title
    layout: title
    title: |-
      サンプルプレゼンテーション
      タイトルをここに記入
    visual:
      subtitle: プレゼンテーションのサブタイトル
      presenter: 発表者名・所属・日付などをここに記入
    # narration: TTS・動画で読み上げる原稿（指定時は PowerPoint ノートにも入る）
    narration: |
      ここにタイトルスライドのナレーション原稿を記載します。プレゼンテーションの導入として、視聴者への挨拶や概要を述べます。
    # notes: PowerPoint ノート専用メモ（TTS では読み上げない）。ナレーション不要の
    #        デッキで登壇メモ・備考を書く用途。ノート欄に入るのは notes ?? narration。
    # notes: |
    #   登壇時の口頭補足やタイムキープのメモをここに記載します（音声化されません）。

  # --------------------------------------------------------------------------
  # 目次・アウトラインスライド（章立てを番号付きで縦並び）
  # layout: agenda / visual: { items[]: string | {title, desc?} }（3-7項目向け）
  # --------------------------------------------------------------------------
  - id: agenda
    layout: agenda
    title: 本日の内容
    visual:
      items:
        - title: 背景と目的
          desc: テーマを取り巻く現状と本発表のねらい
        - title: 方法
          desc: 対象・手順・評価指標
        - title: 結果
          desc: 主要な所見をグラフ・表で提示
        - title: 考察
          desc: 結果の解釈・限界・今後の展望
        - title: まとめ
    narration: |
      ここに目次のナレーション原稿を記載します。本日の発表の流れを示します。

  # --------------------------------------------------------------------------
  # 背景・課題スライド（番号カード型 — 旧 grid を統合した number-cards）
  # layout: number-cards / visual: { subtitle?, badge?, items[].{heading, body, detail?, cites?[], footer?, icon?} }
  # items は 2-4 件（cards でも可）。cites にパンドック形式の引用キーを指定（lib/cite.ts で解決）
  # バッジ（カード上の丸）は3モード:
  #   ・既定        … "01" "02" … の連番
  #   ・badge: none … 番号バッジを省略（カードが上に詰まる）
  #   ・item.icon   … そのカードだけ番号をアイコンに差し替え（MDI 名 or lib/icons.ts のキー）
  # --------------------------------------------------------------------------
  - id: background
    layout: number-cards
    title: "背景：テーマを取り巻く現状"
    visual:
      # subtitle はタイトルに情報を足す時だけ置く（対象領域の限定・根拠の付加など）。
      # タイトルの言い換えなら書かない（省略するとレンダラが残り要素を詰める）。
      subtitle: 国内 12 施設への 2024 年度調査から
      # badge: none        # ← 番号が無意味な場合は省略できる
      items:
        - heading: 課題1のタイトル
          body: 課題1の概要を簡潔に記述
          detail: 具体的なデータや事例を記載
          cites: []
        - heading: 課題2のタイトル
          body: 課題2の概要を簡潔に記述
          detail: 具体的なデータや事例を記載
          cites: []
        - heading: 課題3のタイトル
          body: 課題3の概要を簡潔に記述
          detail: 具体的なデータや事例を記載
          cites: []
    narration: |
      ここに背景説明のナレーション原稿を記載します。3つの課題についてそれぞれ説明を行います。
    # notes: |        # narration の代わりにノート専用メモを書く（TTS では読み上げない）
    #   登壇メモ・備考をここに記載。

  # --------------------------------------------------------------------------
  # 用途別の割合（横棒グラフ）— カテゴリ別の％は文章やカードより横棒で示す
  # layout: usage-bars / visual: { bars[].{label, value, cite?}, axisMax?, subtitle?, banner?, footnote? }
  # --------------------------------------------------------------------------
  - id: usage-by-purpose
    layout: usage-bars
    title: 生成 AI の用途別利用率
    visual:
      subtitle: 国内 12 施設・研究者 312 名（2024 年度）
      axisMax: 50
      bars:
        - label: 文献検索
          value: 42
        - label: 英文校正
          value: 38
        - label: 論文の要約
          value: 27
        - label: データ解析
          value: 12
        - label: 原稿執筆
          value: 9
      footnote: 複数回答。利用率は「月 1 回以上利用」の割合
    narration: |
      ここに用途別利用率のナレーション原稿を記載します。文献検索と英文校正が多く、解析・執筆はまだ少数であることを口頭で補足します。

  # --------------------------------------------------------------------------
  # 特徴・ポイント紹介（番号ではなくアイコンのバッジ — 連番に意味が無い並列要素向け）
  # 各カードに icon を指定すると番号の代わりにアイコンが入る。badge: none で全省略も可。
  # --------------------------------------------------------------------------
  - id: features
    layout: number-cards
    title: 本手法の特長
    visual:
      # 「3つのポイント」のような題名の言い換え subtitle は置かない。
      # body / detail は評価語（速い・堅牢・簡単）ではなく検証可能な事実（数値・条件）で書く。
      # icon は見出しの比喩になるものを MDI から意味で選ぶ（合うものが無ければ省略して番号にする）。
      items:
        - heading: 処理時間
          body: 1 件あたり中央値 0.8 秒
          detail: 計測データ 10 万件
          icon: timer-outline
        - heading: 検証体制
          body: 3 段階の自動チェック
          detail: 構文・整合性・出力形式を順に検査
          icon: shieldCheck
        - heading: 導入手順
          body: 設定ファイル 1 つで起動
          detail: 追加インストール不要
          icon: download-outline
    narration: |
      ここに特長紹介のナレーション原稿を記載します。

  # --------------------------------------------------------------------------
  # 箇条書き本文スライド（タイトル＋階層リスト — 学術発表の最頻出パターン）
  # layout: bullets / visual: { subtitle?, items[]: string | {text, level?, cites?[], bold?}, note? }
  # level 1 で字下げのサブ項目。序論・考察・まとめ等の散文的な列挙に使う。
  # --------------------------------------------------------------------------
  - id: objective
    layout: bullets
    title: 研究の目的
    visual:
      # subtitle: 「本研究が明らかにすること」のような題名の言い換えは置かない
      items:
        - text: 主要な研究課題（リサーチクエスチョン）を1文で提示
          bold: true
        - 背景にある先行研究の到達点と残された課題
        - text: 既存研究で十分に検討されていない点
          level: 1
        - text: 本研究で新たに検証する仮説
          level: 1
        - 本発表で示す主要なアウトカム
      # note はスライド面に描かれる。説明用メモ（「level で字下げできる」等）は書かない
    narration: |
      ここに研究目的のナレーション原稿を記載します。

  # --------------------------------------------------------------------------
  # ツール・手法紹介スライド（2カラム: 特徴一覧 + エビデンス）
  # layout: evidence / visual: { subtitle, features[], evidence_heading,
  #         evidence[].{heading, body, cite}, figure?, figure_cite?, url }
  # --------------------------------------------------------------------------
  - id: notebooklm
    layout: evidence
    title: ツール・手法の紹介
    visual:
      subtitle: ツール名やアプローチの概要
      features:
        - "特徴1: 主要な機能や利点を記載"
        - "特徴2: 他の特徴を記載"
        - "特徴3: さらなる特徴を記載"
        - "特徴4: 補足情報や注意点"
      evidence_heading: 活用事例・エビデンス
      # figure: figure.png          # assets/ 内の補足画像（省略可）
      # figure_cite: ""              # 補足画像の引用キー（省略可）
      evidence:
        - heading: 活用事例1
          body: 事例の概要を記載
          cite: ""
        - heading: 活用事例2
          body: 事例の概要を記載
          cite: ""
        - heading: 活用事例3
          body: 事例の概要を記載
          cite: ""
      url: example.com
    narration: |
      ここにツール・手法紹介のナレーション原稿を記載します。
    # notes: |        # narration の代わりにノート専用メモを書く（TTS では読み上げない）
    #   登壇メモ・備考をここに記載。

  # --------------------------------------------------------------------------
  # ステップ概要スライド（7ステップの一覧表示）
  # layout: steps / visual: { subtitle?, steps[]: string | {title, icon?}, note? }
  # icon は各ステップの内容の比喩を MDI 名で指定（既定アイコンは無い。合うものが無ければ省略）
  # --------------------------------------------------------------------------
  - id: steps-overview
    layout: steps
    title: 研究ワークフローの全体像
    visual:
      # subtitle: 「実践する流れ」は題名の言い換えなので置かない
      steps:
        - { title: 文献検索, icon: book-search-outline }
        - { title: 適格性の選定, icon: filter-outline }
        - { title: データ抽出, icon: table-search }
        - { title: 統計解析, icon: chart-box-outline }
        - { title: 結果の解釈, icon: comment-edit-outline }
        - { title: 原稿執筆, icon: file-document-edit-outline }
        - { title: 投稿・査読, icon: send-outline }
      # note: 「詳細は次のスライドで」のような進行案内はスライドに書かず口頭（narration）で言う
    narration: |
      ここにステップ概要のナレーション原稿を記載します。各ステップの詳細は次のスライドから順に説明します。
    # notes: |        # narration の代わりにノート専用メモを書く（TTS では読み上げない）
    #   登壇メモ・備考をここに記載。

  # --------------------------------------------------------------------------
  # 各ステップ詳細スライド（スクリーンショット＋注釈）
  # layout: step-detail / visual: { step(番号), screenshot, note?,
  #         任意: imgH/imgW/imgY, arrows[], rectAnnotations[], textAnnotations[], overlayImages[] }
  # screenshot は screenshots/ ディレクトリ内のファイル名。タイトルは "Step <step>：<title>" で描画。
  # 注釈の座標はスライド絶対値（インチ）。画像は既定で x=2.04, y=1.35, w=9.24, h=5.2 に置かれる。
  # 「どこを見るか」を赤枠・矢印・短い赤字で示す。注釈の無いスクリーンショットは聴衆が探すことになる。
  # ステップの数だけこのブロックを複製する（見本は 2 枚。screenshots/step-03〜07.png も同梱）。
  # --------------------------------------------------------------------------
  - id: step-1
    layout: step-detail
    title: 文献検索
    visual:
      step: 1
      screenshot: step-01.png
      # 赤枠で注目箇所を囲み、矢印で指す
      rectAnnotations:
        - { x: 2.6, y: 2.0, w: 3.4, h: 0.7 }
      arrows:
        - { x: 6.2, y: 2.15, rotate: 180 }
      textAnnotations:
        - { text: "検索式を入力", x: 7.0, y: 2.05, w: 2.6, h: 0.5, fontSize: 20 }
      note: "PubMed の検索画面（2024 年 12 月時点）"
    narration: |
      ステップ1のナレーション原稿をここに記載します。画面のどこに検索式を入れるかを口頭で補足します。

  - id: step-2
    layout: step-detail
    title: 適格性の選定
    visual:
      step: 2
      screenshot: step-02.png
      # 画像を少し縮めて、下に注釈テキストの余地を作る例（imgH を上書き）
      rectAnnotations:
        - { x: 2.6, y: 4.9, w: 8.1, h: 0.55 }
      textAnnotations:
        - { text: "除外理由を記録", x: 8.4, y: 4.3, w: 2.4, h: 0.5, fontSize: 20 }
      arrows:
        - { x: 7.6, y: 4.95, rotate: 90 }
      note: "選定チェックリスト（PRISMA 2020 準拠）"
    narration: |
      ステップ2のナレーション原稿をここに記載します。除外理由を記録する欄の位置を口頭で補足します。

  # --------------------------------------------------------------------------
  # リスクと品質管理スライド（2カラム: リスク + 対策）
  # layout: risks / visual: { risks_heading, risks[], solutions_heading, solutions[], banner }
  # --------------------------------------------------------------------------
  - id: risks
    layout: risks
    title: リスクと品質管理
    visual:
      risks_heading: 留意すべきリスク
      risks:
        - heading: リスク1のタイトル
          body: リスク1の説明
          cites: []
        - heading: リスク2のタイトル
          body: リスク2の説明
          cites: []
      solutions_heading: 対策のポイント
      solutions:
        - heading: 対策1のタイトル
          body: 対策1の説明
        - heading: 対策2のタイトル
          body: 対策2の説明
          cites: []
      # banner は左右の本文の要約・言い換えでない新情報がある時だけ置く。
      # 「〜すべき」「〜が重要」のような当為・意見はスライドに書かず口頭で言う。
      # banner: 2025 年 4 月以降、院内ガイドライン第 3 版が適用
    narration: |
      ここにリスクと品質管理のナレーション原稿を記載します。
    # notes: |        # narration の代わりにノート専用メモを書く（TTS では読み上げない）
    #   登壇メモ・備考をここに記載。

  # --------------------------------------------------------------------------
  # データの行き先（手元 ↔ クラウド）— 「どこへ何が出るか」は文章よりレーン図で示す
  # layout: data-flow / visual: { lanes[].{name, home, cloud, flow(out|in), flow_label, note, tone(ok|warn)} }
  #   flow: out … データが外へ出る（右向き・accent） / in … 外から受け取るだけ（左向き・primary）
  #   tone:  ok … 手元に留まる（盾アイコン） / warn … 注意（accent）
  # --------------------------------------------------------------------------
  - id: data-flow-demo
    layout: data-flow
    title: 患者データと文献 PDF の行き先
    visual:
      lanes:
        - name: 患者データ
          home: 院内で匿名化して解析
          cloud: 解析コードのみ配布
          flow: in
          flow_label: コードのみ受信
          note: 個人情報は院外に出ない
          tone: ok
        - name: 文献 PDF
          home: 手元で要約を依頼
          cloud: クラウド LLM が本文を受信
          flow: out
          flow_label: 本文を外部へ送信
          note: 出版社の利用規約で再配布が制限される場合がある
          tone: warn
    narration: |
      ここにデータの行き先スライドのナレーション原稿を記載します。患者データは院外に出ず、文献 PDF は外部に送られる、という違いを口頭で説明します。

  # --------------------------------------------------------------------------
  # 事前準備スライド（2x2 カード型チェックリスト）
  # layout: checklist / visual: { subtitle, items[].{title, desc, url?, warning?} }
  # --------------------------------------------------------------------------
  - id: preparation
    layout: checklist
    title: 事前準備
    visual:
      # subtitle: 「事前にご準備ください」は題名の言い換え＋依頼文なので置かない
      items:
        - title: 準備項目1
          desc: 準備項目1の説明
        - title: 準備項目2
          desc: 準備項目2の説明
          url: "https://example.com/"
        - title: 準備項目3
          desc: 準備項目3の説明
        - title: 準備項目4
          desc: 準備項目4の説明
          warning: 注意事項があればここに記載
    narration: |
      ここに事前準備のナレーション原稿を記載します。
    # notes: |        # narration の代わりにノート専用メモを書く（TTS では読み上げない）
    #   登壇メモ・備考をここに記載。

  # --------------------------------------------------------------------------
  # セクション区切り（章扉）— 深い primary 全面＋章番号＋章タイトル
  # layout: section / visual: { number?, eyebrow?, subtitle? }（すべて任意）
  # statement（引用調）とは別用途。大きな章の頭に置く。
  # --------------------------------------------------------------------------
  - id: section-results
    layout: section
    title: 結果
    visual:
      number: "03"
      eyebrow: SECTION
      # subtitle は章の範囲を示す名詞句（文にしない）。無ければ省略
      subtitle: 主要評価項目・副次評価項目・有害事象
    # notes: |        # ナレーション不要なら notes に登壇メモだけ書ける
    #   章の切り替えメモをここに記載。

  # --------------------------------------------------------------------------
  # 図版スライド（大きな図1枚＋キャプション＋引用 — 結果の図表用）
  # layout: figure / visual: { image, subtitle?, caption?, cite? }
  # image は assets/ 内のファイル名。アスペクト比維持で領域いっぱいに配置される。
  # --------------------------------------------------------------------------
  - id: figure-demo
    layout: figure
    title: 反応率の経時変化
    visual:
      # subtitle と caption が同じ内容になるなら subtitle は置かない
      image: sample-figure.png
      caption: 図1. 反応率の経時変化（介入群 vs 対照群、n=120）
      # cite: "your-citekey"     # 引用キーがあれば APA インテキストで併記
    narration: |
      ここに図版スライドのナレーション原稿を記載します。

  # --------------------------------------------------------------------------
  # グラフスライド（PowerPoint で編集できるネイティブグラフ）
  # layout: chart / visual: { chartType, categories[], series[].{name, values[]}, subtitle?, note?, showValue? }
  #   chartType: bar(縦棒) / barh(横棒) / line / area / pie / doughnut
  #   系列色はテーマの step1..7 を自動割当て（theme 差し替えに追従）
  # --------------------------------------------------------------------------
  - id: chart-demo
    layout: chart
    title: 介入前後のスコア比較
    visual:
      subtitle: 3 施設の平均値（各 n=40）
      chartType: bar
      categories: ["A 施設", "B 施設", "C 施設"]
      series:
        - name: 介入前
          values: [42, 55, 38]
        - name: 介入後
          values: [68, 72, 61]
      # note: グラフの実装説明はスライド面に書かない（グラフは PowerPoint 上でデータ編集可能）
    narration: |
      ここにグラフスライドのナレーション原稿を記載します。

  # --------------------------------------------------------------------------
  # 2 経路の対比 — 同じ起点から分かれる 2 つの道を左右に並べ、見た目の類似と中身の違いを示す
  # layout: compare-paths / visual: { source, left{name, icon?, note}, right{...}, middle?,
  #         diffs_heading?, diffs[]?, conclusion, eyebrow?, cite?, cites? }
  # conclusion は事実（検証結果の数値など）を書く。「〜すべき」は口頭で
  # --------------------------------------------------------------------------
  - id: compare-analysis
    layout: compare-paths
    title: 統計ソフトと生成 AI による解析結果
    visual:
      source: 同一の臨床データ（n=120）
      left:
        name: 統計ソフトで解析
        icon: calculator-variant-outline
        note: 解析手順をログに記録
      right:
        name: 生成 AI に解析を依頼
        icon: robot-outline
        note: 手順の記載が無いことがある
      middle: 一見同じ
      diffs_heading: 出力に記載が無かった項目
      diffs:
        - 欠損値の扱い
        - 多重比較の補正
        - 使用したライブラリのバージョン
      conclusion: 検証 20 件中 14 件で、欠損値の扱いが出力に記載されなかった
    narration: |
      ここに 2 経路対比のナレーション原稿を記載します。同じデータでも手順の記録に差が出ること、再計算で確認する必要があることは口頭で述べます。

  # --------------------------------------------------------------------------
  # 表スライド（PowerPoint で編集できるネイティブ表）
  # layout: table / visual: { headers[], rows[][], subtitle?, note?, colW[]? }
  #   header 行は primary 背景＋白字、本文は白/オフ白の交互ストライプ
  # --------------------------------------------------------------------------
  - id: table-demo
    layout: table
    title: プラン比較表
    visual:
      # subtitle: 「主要 3 プランの比較」は題名の言い換えなので置かない
      headers: ["項目", "Free", "Pro", "Enterprise"]
      rows:
        - ["月額", "0 円", "1,500 円", "要問合せ"]
        - ["ユーザー数", "1", "10", "無制限"]
        - ["サポート", "なし", "メール", "専任担当"]
        - ["SLA", "—", "99.5%", "99.9%"]
      # note: 表の実装説明はスライド面に書かない（先頭列は行ラベルとして強調表示される）
    narration: |
      ここに表スライドのナレーション原稿を記載します。

  # --------------------------------------------------------------------------
  # 巨大数値スライド（KPI・統計値のインパクト提示 — 1-3 個）
  # layout: big-stat / visual: { subtitle?, stats[].{value, label?, sub?}, note? }
  # value は "95%" のように単位込みで引用符付き推奨（value のみ必須）
  # --------------------------------------------------------------------------
  - id: keynumbers
    layout: big-stat
    title: 主要な数値
    visual:
      # subtitle: 「本研究のキーメッセージ」は題名の言い換えなので置かない
      stats:
        - value: "68%"
          label: 介入群の改善率
          sub: 対照群比 +27pt
        - value: "3.2×"
          label: 反応速度の向上
          sub: ベースライン比
        - value: "p<.01"
          label: 統計的有意差
          sub: 主要評価項目
    narration: |
      ここに主要数値スライドのナレーション原稿を記載します。

  # --------------------------------------------------------------------------
  # 汎用2カラムスライド（左テキスト/右図 — 図と説明を横に並べる）
  # layout: split / visual: { subtitle?, items[], image?, imageSide?(left/right), caption?, note? }
  # items は string か {text, level?, cites?, bold?}。imageSide で図の左右を切替（既定 right）。
  # --------------------------------------------------------------------------
  - id: discussion
    layout: split
    title: 考察
    visual:
      # subtitle: 「結果の解釈」は題名の言い換えなので置かない
      # 考察でもスライド面は観察された事実（差・先行研究との一致/不一致・限界）にとどめ、
      # そこからの推論（「〜と考えられる」「〜すべき」）は narration で述べる
      items:
        - text: 介入群で一貫した改善（全 3 施設）
          bold: true
        - 群間差は 4 週以降で拡大
        - text: 先行研究の報告と一致
          level: 1
          # cites: ["your-citekey"]   # 先行研究との比較には引用を付ける
        - 限界：単一施設・短期間の観察
      image: sample-figure.png
      imageSide: right
      caption: 図2. 反応推移（再掲）
    narration: |
      ここに考察スライドのナレーション原稿を記載します。

  # --------------------------------------------------------------------------
  # クロージングスライド（タイムライン + 締めメッセージ）
  # layout: closing / visual: { timeline[].{time, duration, desc}, closing_message, closing_sub, conference }
  # --------------------------------------------------------------------------
  - id: closing
    layout: closing
    title: 当日の流れ
    visual:
      timeline:
        - time: パート1
          duration: 10分
          desc: パート1の内容説明
        - time: パート2
          duration: 35分
          desc: パート2の内容説明
        - time: パート3
          duration: 15分
          desc: パート3の内容説明
      closing_message: |-
        締めのメッセージをここに記載
      # closing_sub: closing_message の言い換えなら置かない（連絡先・資料 URL など新情報がある時だけ）
      conference: イベント名・日付をここに記入
    narration: |
      ここにクロージングのナレーション原稿を記載します。
    # notes: |        # narration の代わりにノート専用メモを書く（TTS では読み上げない）
    #   登壇メモ・備考をここに記載。

  # --------------------------------------------------------------------------
  # 文献一覧スライド（自動生成 — cite() で参照された文献が一覧表示される）
  # layout: references。引用が1件も無い場合はこのスライドは生成されない。
  # --------------------------------------------------------------------------
  - id: references
    layout: references
    title: References
    # notes: |        # この自動生成スライドにも登壇メモを付けられる（TTS では読み上げない）
    #   登壇メモ・備考をここに記載。
